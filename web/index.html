<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>bullwhip · dashboards</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; margin: 0; padding: 20px 28px; background: #fff; color: #000; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } .card { border-color: #fff !important; } }
  h1 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid currentColor; padding-bottom: 12px; }
  .card { border: 1px solid #000; padding: 14px 16px; margin-top: 16px; }
  .card h2 { font-size: 13px; margin: 0 0 6px; }
  .card p { margin: 0; color: #666; font-size: 12px; }
  .card a { color: inherit; font-weight: 600; text-decoration: none; }
  .card a:hover { text-decoration: underline; }
  code { font-size: 11px; }
  select { font: inherit; background: #fff; border: 1px solid #000; }
  @media (prefers-color-scheme: dark) { select { background: #000; color: #fff; } }
</style>
</head>
<body>
<h1>bullwhip · six dashboards, one night's artifacts</h1>
<div id="cards"></div>
<script type="module">
import { params, listNights, el } from "./shared.js";

const options = [
  ["a.html", "A — faithful Flask port", "The original web/static/style.css vocabulary: slate header, flat-UI green/red/orange, command Gantt with 'show every command' toggle, checkbox log-debugging view."],
  ["b.html", "B — Observable Plot Gantt + ELK DAG", "The live-observability plan: chart-library Gantt of every tracked command, plus the make DAG laid out by ELK with the critical path highlighted. Loads Plot + elkjs from the CDN."],
  ["c.html", "C — Mara outcome ledger", "Task success is not data success: one table for make exits, one for the dlt-ops _dlt_ops_runs ledger (records extracted/loaded, errors), one for warehouse row counts. Flags nights where make went green but the data didn't."],
  ["d.html", "D — dataroom monochrome", "The dataroom dashboard language: hairline grid, progress/NOW hero, vitals cells (critical path, rows loaded, retries), activity feed, log tree + preview, hatched running bars. Dark mode for free."],
  ["e.html", "E — Flask views, monochrome", "A's two views (command Gantt with time column and 'show every command', checkbox log debugging) in D's visual language: solid = success, hatched = running, outlined = failed."],
  ["f.html", "F — E, trimmed", "E with the redundant and non-informative parts removed: no exit 0, no per-row clock on short nights, helper targets folded away, one verdict, no footer."],
];

const cards = document.getElementById("cards");
for (const [file, title, desc] of options) {
  cards.append(el("div", { class: "card" },
    el("h2", {}, el("a", { href: `${file}?project=${encodeURIComponent(params().project)}` }, title)),
    el("p", {}, desc, " "),
    el("code", {}, file)));
}
</script>
</body>
</html>
