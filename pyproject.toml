[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bullwhip"
version = "0.1.0"
description = "Nightly batch data-pipeline framework: cron + make + dlt-ops + SQLMesh"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "dlt[duckdb]>=1.30.0",
    "dlt-ops>=0.1.0",
    "sqlmesh[duckdb]>=0.140.0",
    "duckdb>=1.2.0,<1.3.0",
]

[project.scripts]
bullwhip = "bullwhip.cli:main"

[project.optional-dependencies]
postgres = ["dlt[postgres]"]
bigquery = ["dlt[bigquery]", "google-cloud-bigquery"]
clickhouse = ["dlt[clickhouse]", "clickhouse-connect"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["bullwhip"]

# Reuse the checked-in pipeline without bundling local config, credentials,
# warehouse contents, or logs.
[tool.hatch.build.targets.wheel.force-include]
"config/demo.dlt.toml" = "bullwhip/_demo/.dlt/config.toml"
"examples/github-health/makefile" = "bullwhip/_demo/examples/github-health/makefile"
"github_health/resource/__init__.py" = "bullwhip/_demo/github_health/resource/__init__.py"
"github_health/source/github_health.py" = "bullwhip/_demo/github_health/source/github_health.py"
"lib/boilerplate.mk" = "bullwhip/_demo/lib/boilerplate.mk"
"lib/critical_path.py" = "bullwhip/_demo/lib/critical_path.py"
"lib/fingerprint.py" = "bullwhip/_demo/lib/fingerprint.py"
"lib/run_ledger.py" = "bullwhip/_demo/lib/run_ledger.py"
"lib/tracking_shell.py" = "bullwhip/_demo/lib/tracking_shell.py"
"lib/warehouse_parquet.py" = "bullwhip/_demo/lib/warehouse_parquet.py"
"sqlmesh/config.yaml" = "bullwhip/_demo/sqlmesh/config.yaml"
"sqlmesh/models" = "bullwhip/_demo/sqlmesh/models"

# uv's normal local build cache only watches package metadata.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "bullwhip/*.py" },
    { file = "config/demo.dlt.toml" },
    { file = "examples/github-health/makefile" },
    { file = "github_health/**/*.py" },
    { file = "lib/*" },
    { file = "sqlmesh/config.yaml" },
    { file = "sqlmesh/models/*.sql" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["lib"]
omit = ["lib/dlt_ops_fallback.py"]

[tool.coverage.report]
show_missing = true
fail_under = 60
